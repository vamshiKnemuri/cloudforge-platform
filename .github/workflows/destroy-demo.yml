name: Destroy AWS Demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to remove the EKS demo
        required: true
        type: string
      remove_bootstrap:
        description: Also delete the OIDC role and Terraform state stack
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudforge-aws-demo
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirmation == 'DESTROY'
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Restrict the EKS API to this runner
        run: |
          RUNNER_PUBLIC_IP="$(curl --fail --silent --show-error https://checkip.amazonaws.com)"
          test -n "$RUNNER_PUBLIC_IP"
          echo "TF_VAR_cluster_public_access_cidrs=[\"${RUNNER_PUBLIC_IP}/32\"]" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Destroy the demo infrastructure
        working-directory: infrastructure/terraform
        run: terraform destroy -auto-approve -var="aws_region=$AWS_REGION" -var="github_repository=$GITHUB_REPOSITORY"
      - name: Delete bootstrap stack
        if: inputs.remove_bootstrap
        run: |
          aws s3 rm "s3://$TF_STATE_BUCKET" --recursive
          aws cloudformation delete-stack --stack-name cloudforge-github-bootstrap
          aws cloudformation wait stack-delete-complete --stack-name cloudforge-github-bootstrap
      - name: Confirm cleanup
        run: echo "CloudForge AWS demo resources were destroyed." >> "$GITHUB_STEP_SUMMARY"
