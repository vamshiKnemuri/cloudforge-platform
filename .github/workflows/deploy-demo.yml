name: Deploy AWS Demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to create billable AWS resources
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudforge-aws-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Verify repository variables
        run: |
          test -n "${{ vars.AWS_ROLE_ARN }}"
          test -n "$AWS_REGION"
          test -n "$TF_STATE_BUCKET"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Restrict the EKS API to this runner
        run: |
          RUNNER_PUBLIC_IP="$(curl --fail --silent --show-error https://checkip.amazonaws.com)"
          test -n "$RUNNER_PUBLIC_IP"
          echo "TF_VAR_cluster_public_access_cidrs=[\"${RUNNER_PUBLIC_IP}/32\"]" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: Plan infrastructure
        working-directory: infrastructure/terraform
        run: terraform plan -out=cloudforge.tfplan -var="aws_region=$AWS_REGION" -var="github_repository=$GITHUB_REPOSITORY"

      - name: Apply infrastructure
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve cloudforge.tfplan

      - name: Capture Terraform outputs
        id: infra
        working-directory: infrastructure/terraform
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable application image
        env:
          ECR_REPOSITORY: ${{ steps.infra.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$IMAGE_TAG" -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure Kubernetes access
        run: aws eks update-kubeconfig --name "${{ steps.infra.outputs.cluster_name }}" --region "$AWS_REGION"

      - uses: azure/setup-helm@v4.3.1

      - name: Install Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm upgrade --install argocd argo/argo-cd --namespace argocd --create-namespace --wait --timeout 10m

      - name: Install Kubernetes metrics server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system --wait --timeout 5m

      - name: Install observability stack
        run: |
          GRAFANA_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$GRAFANA_PASSWORD"
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --values observability/kube-prometheus-values.yaml \
            --set-string grafana.adminPassword="$GRAFANA_PASSWORD" \
            --wait --timeout 15m
          kubectl create configmap cloudforge-dashboard \
            --namespace monitoring \
            --from-file=cloudforge-dashboard.json=observability/cloudforge-dashboard.json \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install and configure Kyverno policy enforcement
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm upgrade --install kyverno kyverno/kyverno \
            --namespace kyverno --create-namespace \
            --set admissionController.replicas=1 \
            --wait --timeout 10m
          kubectl apply -f policies/require-secure-workloads.yaml

      - name: Register CloudForge with Argo CD
        env:
          GITOPS_REPO_URL: https://github.com/${{ github.repository }}.git
          IMAGE_REPOSITORY: ${{ steps.infra.outputs.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: envsubst < gitops/applications/cloudforge.yaml.tpl | kubectl apply -f -

      - name: Wait for the application rollout
        run: |
          kubectl wait --for=condition=Available deployment/cloudforge \
            --namespace cloudforge --timeout=10m
          kubectl get pods,services,hpa --namespace cloudforge

      - name: Write deployment summary
        run: |
          {
            echo "## CloudForge demo deployed"
            echo ""
            echo "- Cluster: \`${{ steps.infra.outputs.cluster_name }}\`"
            echo "- Image: \`${{ steps.infra.outputs.ecr_repository }}:${{ github.sha }}\`"
            echo "- Next: follow \`docs/DEMO.md\` to record the demo."
            echo "- Mandatory: run the Destroy AWS Demo workflow after recording."
          } >> "$GITHUB_STEP_SUMMARY"
