apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudforge.name" . }}
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cloudforge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP

