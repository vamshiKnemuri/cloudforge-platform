replicaCount: 2

image:
  repository: example.invalid/cloudforge
  tag: dev
  pullPolicy: IfNotPresent

environment: demo

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

serviceMonitor:
  enabled: true
  interval: 15s

prometheusRule:
  enabled: true

